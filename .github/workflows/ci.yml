name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - ".spec-workflow/**"
      - "**/*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - ".spec-workflow/**"
      - "**/*.md"

permissions:
  contents: read

# A newer run for the same branch or pull request replaces the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and format
    runs-on: ubuntu-26.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      # The Android project is not built here: it needs the Android workload and JDK 21. The nightly workflow builds it.
      - name: Build
        run: |
          dotnet build src/PressToShape.Desktop -c Release
          dotnet build tests/PressToShape.Core.Tests -c Release
          dotnet build tests/PressToShape.App.Tests -c Release
          dotnet build tests/PressToShape.CodeIndex.Tests -c Release
          dotnet build tests/PressToShape.CursorImages.Tests -c Release
      - name: Test
        run: |
          dotnet test tests/PressToShape.Core.Tests -c Release --no-build
          dotnet test tests/PressToShape.App.Tests -c Release --no-build
          dotnet test tests/PressToShape.CodeIndex.Tests -c Release --no-build
          dotnet test tests/PressToShape.CursorImages.Tests -c Release --no-build
      # A format check of the whole solution would also load the Android project, so each project without it is checked on its own.
      - name: Check formatting
        run: |
          for project in \
            src/PressToShape.Core \
            src/PressToShape.App \
            src/PressToShape.Desktop \
            tools/PressToShape.CodeIndex \
            tools/PressToShape.CursorImages \
            tests/PressToShape.Core.Tests \
            tests/PressToShape.App.Tests \
            tests/PressToShape.CodeIndex.Tests \
            tests/PressToShape.CursorImages.Tests; do
            echo "::group::dotnet format $project"
            dotnet format "$project" --verify-no-changes
            echo "::endgroup::"
          done
