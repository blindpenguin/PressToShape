name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      last_sha: ${{ steps.check.outputs.last_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly-$(date -u +%Y%m%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          head_sha="$(git rev-parse HEAD)"
          last_tag="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("nightly-"))][0].tagName // ""')"
          if [ -n "$last_tag" ]; then
            last_sha="$(gh api "repos/${{ github.repository }}/commits/$last_tag" --jq .sha)"
          else
            last_sha=""
          fi
          echo "last_sha=$last_sha" >> "$GITHUB_OUTPUT"
          if [ "$head_sha" = "$last_sha" ]; then
            echo "master has not changed since $last_tag. No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-26.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Test
        run: |
          dotnet build tests/PressToShape.Core.Tests -c Release
          dotnet build tests/PressToShape.App.Tests -c Release
          dotnet test tests/PressToShape.Core.Tests -c Release --no-build
          dotnet test tests/PressToShape.App.Tests -c Release --no-build
      - name: Publish Linux and Windows
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish src/PressToShape.Desktop -c Release -r "$rid" --self-contained \
              -p:DebugType=None -p:DebugSymbols=false -o "publish/$rid"
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android workload
        run: dotnet workload install android
      - name: Publish Android
        run: |
          tag='${{ needs.check.outputs.tag }}'
          # Signed with the generated debug key, so the APK installs by sideloading. A new build has another key: uninstall the old one first.
          dotnet publish src/PressToShape.Android -c Release \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True \
            -p:ApplicationVersion="$(date -u +%Y%m%d)" -p:ApplicationDisplayVersion="$tag" \
            -o publish/android
      - name: Package
        run: |
          mkdir dist
          cp publish/android/de.limeonfire.presstoshape-Signed.apk "dist/PressToShape-${{ needs.check.outputs.tag }}-android.apk"
          tag='${{ needs.check.outputs.tag }}'
          tar -C publish/linux-x64 -czf "dist/PressToShape-$tag-linux-x64.tar.gz" .
          (cd publish/win-x64 && zip -qr "../../dist/PressToShape-$tag-win-x64.zip" .)
      - name: Build AppImage
        run: |
          tag='${{ needs.check.outputs.tag }}'
          mkdir -p AppDir/usr/bin
          cp -r publish/linux-x64/. AppDir/usr/bin/
          cp packaging/presstoshape.desktop AppDir/
          cp packaging/presstoshape.png AppDir/presstoshape.png
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/PressToShape.Desktop" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          chmod -R a+rX AppDir
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "dist/PressToShape-$tag-x86_64.AppImage"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.check.outputs.tag }}'
          sha="$(git rev-parse HEAD)"
          last_sha='${{ needs.check.outputs.last_sha }}'
          if [ -n "$last_sha" ]; then
            range="$last_sha..$sha"
          else
            range="$sha"
          fi
          {
            echo "Automatic build of master at \`$sha\`."
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } > notes.md
          gh release create "$tag" dist/* \
            --target "$sha" \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md
